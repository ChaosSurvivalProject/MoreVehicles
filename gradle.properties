# More Vehicles - Gradle properties
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

# Compilation target = Java 21 toolchain.
# NOTE: fabric-loom 1.19.4 requires Gradle 9.8+ running on a JVM 25+;
#       the Gradle daemon JVM can be 25 while bytecode target stays 21.
org.gradle.java.installations.paths=/opt/jdk21

# Fabric / mod metadata
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.20.1
fabric_api_version=0.141.6+1.21.11

# Paper/Purpur (compile-time API; runtime deploy target is Purpur 1.21.11)
paper_api_version=1.21.11-R0.1-SNAPSHOT

# Protocol
protocol_version=1
